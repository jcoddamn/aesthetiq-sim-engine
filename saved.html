<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>AesthetIQ — Saved procedures</title>
    <link rel="stylesheet" href="css/product.css?v=1" />
  </head>
  <body>
    <main class="aq-main">
      <header class="aq-masthead">
        <a class="aq-brand" href="index.html">Aesthet<span>IQ</span></a
        ><a class="aq-subtle-link" href="about.html#local-data"
          >About local storage</a
        >
      </header>
      <section class="aq-section">
        <p class="eyebrow">Your shortlist</p>
        <h1 style="font-size: 40px; margin: 12px 0">
          Keep your options close.
        </h1>
        <p style="color: var(--muted)">
          Save procedures to revisit before your consultation. Your list stays
          in this browser.
        </p>
        <p
          id="savedStatus"
          class="aq-feedback"
          role="status"
          aria-live="polite"
        ></p>
        <div id="savedContainer" class="aq-saved-grid">
          <p class="aq-loading">Loading saved procedures…</p>
        </div>
      </section>
    </main>
    <nav class="bottom-nav"></nav>
    <script type="module" src="js/savedPage.js"></script>
  </body>
</html>

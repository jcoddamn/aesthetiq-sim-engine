<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>AesthetIQ</title>

  <style>
    :root {
      --accent: #6b46c1;
      --accent-light: #a78bfa;
      --background: #faf9fc;
      --text: #18181b;
      --muted: #71717a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top, #eee8ff 0%, transparent 48%),
        var(--background);
      color: var(--text);
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    .splash-screen {
      min-height: 100vh;
      padding: 32px 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .logo-mark {
      width: 92px;
      height: 92px;
      margin-bottom: 24px;
      border-radius: 28px;
      background: linear-gradient(
        145deg,
        var(--accent-light),
        var(--accent)
      );
      color: white;
      display: grid;
      place-items: center;
      font-size: 36px;
      font-weight: 800;
      box-shadow: 0 20px 45px rgba(107, 70, 193, 0.28);
      animation: rise 0.8s ease both;
    }

    .brand {
      margin: 0;
      font-size: 42px;
      line-height: 1;
      letter-spacing: -1.8px;
      animation: rise 0.8s 0.12s ease both;
    }

    .brand span {
      color: var(--accent);
    }

    .tagline {
      max-width: 310px;
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.55;
      animation: rise 0.8s 0.22s ease both;
    }

    .loading {
      width: 110px;
      height: 4px;
      margin-top: 42px;
      overflow: hidden;
      border-radius: 999px;
      background: #e4e4e7;
    }

    .loading::after {
      content: "";
      display: block;
      width: 50%;
      height: 100%;
      border-radius: inherit;
      background: var(--accent);
      animation: load 1.4s ease-in-out infinite;
    }

    .footer {
      position: fixed;
      bottom: 28px;
      color: var(--muted);
      font-size: 12px;
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(14px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes load {
      0% {
        transform: translateX(-120%);
      }

      100% {
        transform: translateX(220%);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
      }
    }
  </style>
</head>

<body>
  <main class="splash-screen">
    <div class="logo-mark" aria-hidden="true">AI</div>

    <h1 class="brand">
      Aesthet<span>IQ</span>
    </h1>

    <p class="tagline">
      Visualize cosmetic possibilities with clarity and confidence.
    </p>

    <div class="loading" aria-label="Loading"></div>

    <p class="footer">Educational visualization only</p>
  </main>

  <script>
    const consentAccepted =
      localStorage.getItem("aesthetiqConsentAccepted") === "true";

    window.setTimeout(() => {
      window.location.href = consentAccepted
        ? "home.html"
        : "consent.html";
    }, 2200);
  </script>
</body>
</html>

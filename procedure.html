<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <meta
    name="description"
    content="Learn about cosmetic procedures with AesthetIQ."
  />

  <title>Procedure Details | AesthetIQ</title>

  <style>
    :root {
      --background: #f7f6fa;
      --surface: #ffffff;
      --surface-soft: #fbfafd;

      --text: #18181b;
      --muted: #71717a;
      --border: #e8e5ee;

      --accent: #6d45c6;
      --accent-dark: #5633a7;
      --accent-soft: #eee9fb;

      --success-background: #eaf8ef;
      --success-text: #267749;

      --preview-background: #fff5d9;
      --preview-text: #8a6511;

      --education-background: #edf3ff;
      --education-text: #315f9e;

      --danger-soft: #fff1f2;
      --danger-text: #9f1239;

      --shadow:
        0 14px 40px rgba(45, 35, 67, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    .app {
      width: 100%;
      max-width: 760px;
      min-height: 100vh;
      margin: 0 auto;
      padding-bottom: 118px;
    }

    .topbar {
      position: sticky;
      z-index: 30;
      top: 0;
      display: grid;
      grid-template-columns: 44px 1fr 44px;
      align-items: center;
      min-height: 70px;
      padding:
        env(safe-area-inset-top)
        18px
        0;
      border-bottom:
        1px solid rgba(232, 229, 238, 0.85);
      background:
        rgba(247, 246, 250, 0.92);
      backdrop-filter: blur(18px);
    }

    .topbar-button {
      width: 42px;
      height: 42px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--surface);
      display: grid;
      place-items: center;
      color: var(--text);
      box-shadow:
        0 8px 24px rgba(45, 35, 67, 0.07);
      font-size: 18px;
    }

    .topbar-button.saved {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent);
    }

    .brand {
      text-align: center;
      font-size: 20px;
      font-weight: 850;
      letter-spacing: -0.7px;
    }

    .brand span {
      color: var(--accent);
    }

    .page-content {
      padding: 22px 20px 34px;
    }

    .hero {
      position: relative;
      overflow: hidden;
      padding: 25px;
      border-radius: 28px;
      background:
        radial-gradient(
          circle at top right,
          rgba(255, 255, 255, 0.26),
          transparent 35%
        ),
        linear-gradient(
          145deg,
          #7651cc,
          #5732a8
        );
      color: white;
      box-shadow:
        0 20px 48px rgba(88, 52, 165, 0.25);
    }

    .hero-icon {
      width: 66px;
      height: 66px;
      margin-bottom: 18px;
      border:
        1px solid rgba(255, 255, 255, 0.32);
      border-radius: 21px;
      background:
        rgba(255, 255, 255, 0.16);
      display: grid;
      place-items: center;
      backdrop-filter: blur(12px);
      font-size: 31px;
    }

    .hero-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 7px;
      margin-bottom: 9px;
      color:
        rgba(255, 255, 255, 0.82);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.55px;
      text-transform: uppercase;
    }

    .hero-meta span + span::before {
      content: "•";
      margin-right: 7px;
    }

    .hero h1 {
      max-width: 570px;
      margin: 0;
      font-size:
        clamp(31px, 8vw, 47px);
      line-height: 1.02;
      letter-spacing: -1.7px;
    }

    .hero-summary {
      max-width: 590px;
      margin: 14px 0 0;
      color:
        rgba(255, 255, 255, 0.88);
      font-size: 14px;
      line-height: 1.6;
    }

    .hero-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 19px;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      min-height: 31px;
      padding: 6px 11px;
      border-radius: 999px;
      background:
        rgba(255, 255, 255, 0.16);
      color: white;
      font-size: 10px;
      font-weight: 850;
      backdrop-filter: blur(10px);
    }

    .quick-actions {
      display: grid;
      grid-template-columns:
        repeat(2, minmax(0, 1fr));
      gap: 11px;
      margin-top: 15px;
    }

    .quick-action {
      min-height: 49px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--surface);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: var(--text);
      font-size: 12px;
      font-weight: 800;
      box-shadow: var(--shadow);
    }

    .quick-action:active {
      transform: scale(0.98);
    }

    .save-button {
      width: 100%;
      min-height: 52px;
      margin-top: 12px;
      border: 1px solid var(--accent);
      border-radius: 17px;
      background: var(--surface);
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      font-size: 13px;
      font-weight: 850;
      box-shadow: var(--shadow);
    }

    .save-button.saved {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent-dark);
    }

    .save-button:active {
      transform: scale(0.985);
    }

    .save-confirmation {
      min-height: 20px;
      margin: 7px 0 0;
      color: var(--success-text);
      text-align: center;
      font-size: 11px;
      font-weight: 700;
    }

    .section {
      margin-top: 16px;
      padding: 21px;
      border: 1px solid var(--border);
      border-radius: 24px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .section-heading {
      display: flex;
      align-items: center;
      gap: 11px;
      margin-bottom: 14px;
    }

    .section-icon {
      width: 40px;
      height: 40px;
      flex-shrink: 0;
      border-radius: 13px;
      background: var(--accent-soft);
      display: grid;
      place-items: center;
      font-size: 18px;
    }

    .section h2 {
      margin: 0;
      font-size: 19px;
      letter-spacing: -0.45px;
    }

    .section p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.65;
    }

    .information-list {
      display: grid;
      gap: 10px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .information-list li {
      position: relative;
      padding:
        13px 14px 13px 42px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--surface-soft);
      color: #3f3f46;
      font-size: 13px;
      line-height: 1.45;
    }

    .information-list li::before {
      content: "✓";
      position: absolute;
      top: 50%;
      left: 14px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--accent-soft);
      color: var(--accent);
      display: grid;
      place-items: center;
      transform: translateY(-50%);
      font-size: 11px;
      font-weight: 900;
    }

    .risk-list li::before {
      content: "!";
      background: var(--danger-soft);
      color: var(--danger-text);
    }

    .camera-card {
      margin-top: 16px;
      padding: 22px;
      border:
        1px solid rgba(109, 69, 198, 0.2);
      border-radius: 26px;
      background:
        linear-gradient(
          145deg,
          rgba(238, 233, 251, 0.98),
          rgba(255, 255, 255, 0.98)
        );
      box-shadow: var(--shadow);
    }

    .camera-header {
      display: flex;
      align-items: flex-start;
      gap: 13px;
    }

    .camera-icon {
      width: 49px;
      height: 49px;
      flex-shrink: 0;
      border-radius: 16px;
      background: var(--accent);
      color: white;
      display: grid;
      place-items: center;
      font-size: 21px;
      box-shadow:
        0 12px 25px
        rgba(109, 69, 198, 0.24);
    }

    .camera-card h2 {
      margin: 1px 0 5px;
      font-size: 20px;
      letter-spacing: -0.45px;
    }

    .camera-description {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      min-height: 29px;
      margin-top: 14px;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 850;
    }

    .status-interactive {
      background:
        var(--success-background);
      color: var(--success-text);
    }

    .status-preview {
      background:
        var(--preview-background);
      color: var(--preview-text);
    }

    .status-educational {
      background:
        var(--education-background);
      color: var(--education-text);
    }

    .camera-button {
      width: 100%;
      min-height: 54px;
      margin-top: 16px;
      border: 0;
      border-radius: 17px;
      background: var(--accent);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      font-size: 13px;
      font-weight: 850;
      box-shadow:
        0 14px 30px
        rgba(109, 69, 198, 0.25);
    }

    .camera-button:active {
      transform: scale(0.985);
    }

    .camera-button.disabled {
      background: #d8d4df;
      color: #77717e;
      box-shadow: none;
      cursor: not-allowed;
    }

    .disclaimer {
      margin-top: 16px;
      padding: 17px;
      border: 1px solid var(--border);
      border-radius: 19px;
      background: var(--surface-soft);
      color: var(--muted);
      font-size: 11px;
      line-height: 1.6;
    }

    .error-state {
      margin-top: 40px;
      padding: 28px 22px;
      border: 1px solid #fecaca;
      border-radius: 24px;
      background: #fff7f7;
      text-align: center;
      box-shadow: var(--shadow);
    }

    .error-state h1 {
      margin: 0;
      font-size: 25px;
    }

    .error-state p {
      margin: 10px auto 18px;
      color: #7f1d1d;
      font-size: 13px;
      line-height: 1.55;
    }

    .error-link {
      display: inline-flex;
      min-height: 45px;
      padding: 0 16px;
      border-radius: 14px;
      background: var(--accent);
      color: white;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 800;
    }

    .bottom-action-bar {
      position: fixed;
      z-index: 35;
      right: 0;
      bottom: 0;
      left: 0;
      padding:
        10px
        15px
        calc(
          10px +
          env(safe-area-inset-bottom)
        );
      border-top: 1px solid var(--border);
      background:
        rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(18px);
    }

    .bottom-action-inner {
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
      display: grid;
      grid-template-columns:
        55px minmax(0, 1fr);
      gap: 10px;
    }

    .favorite-button {
      min-height: 54px;
      border: 1px solid var(--border);
      border-radius: 17px;
      background: var(--surface);
      color: var(--accent);
      font-size: 22px;
    }

    .favorite-button.saved {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent);
    }

    .main-bottom-button {
      min-height: 54px;
      border: 0;
      border-radius: 17px;
      background: var(--accent);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 850;
      box-shadow:
        0 13px 28px
        rgba(109, 69, 198, 0.23);
    }

    .main-bottom-button.disabled {
      background: #d8d4df;
      color: #77717e;
      box-shadow: none;
      pointer-events: none;
    }
/* PROCEDURE MATERIAL / PRODUCT SELECTOR */

.option-sheet-backdrop {
  position: fixed;
  inset: 0;
  z-index: 2000;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding: 16px;
  background: rgba(20, 18, 28, 0.42);
  backdrop-filter: blur(8px);
  opacity: 0;
  visibility: hidden;
  transition:
    opacity 0.25s ease,
    visibility 0.25s ease;
}

.option-sheet-backdrop.open {
  opacity: 1;
  visibility: visible;
}

.option-sheet {
  position: relative;
  width: min(100%, 520px);
  max-height: 88vh;
  overflow-y: auto;
  padding: 14px 22px 24px;
  background: #ffffff;
  border-radius: 30px 30px 22px 22px;
  box-shadow: 0 -12px 50px rgba(35, 25, 70, 0.18);
  transform: translateY(40px);
  transition: transform 0.28s ease;
}

.option-sheet-backdrop.open .option-sheet {
  transform: translateY(0);
}

.sheet-handle {
  width: 48px;
  height: 5px;
  margin: 2px auto 22px;
  border-radius: 999px;
  background: #d7d4df;
}

.sheet-close {
  position: absolute;
  top: 18px;
  right: 20px;
  width: 38px;
  height: 38px;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: #f3f1f7;
  color: #2d2935;
  font-size: 28px;
  line-height: 1;
  cursor: pointer;
}

.sheet-label {
  margin: 0 0 5px;
  color: #756e7f;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.option-sheet h2 {
  margin: 0;
  padding-right: 45px;
  color: #18171c;
  font-size: 28px;
  line-height: 1.2;
}

.sheet-description {
  margin: 10px 0 20px;
  color: #706b77;
  font-size: 16px;
  line-height: 1.45;
}

.option-list {
  display: grid;
  gap: 11px;
}

.treatment-option {
  display: flex;
  align-items: flex-start;
  gap: 13px;
  padding: 16px;
  border: 1.5px solid #e8e5ee;
  border-radius: 18px;
  background: #faf9fc;
  cursor: pointer;
  transition:
    border-color 0.2s ease,
    background-color 0.2s ease,
    transform 0.2s ease;
}

.treatment-option:hover {
  transform: translateY(-1px);
}

.treatment-option.selected {
  border-color: #6842c2;
  background: #f4efff;
}

.treatment-option input {
  width: 20px;
  height: 20px;
  margin: 2px 0 0;
  accent-color: #6842c2;
  flex-shrink: 0;
}

.option-copy {
  display: block;
}

.option-name {
  display: block;
  color: #252229;
  font-size: 16px;
  font-weight: 700;
}

.option-detail {
  display: block;
  margin-top: 4px;
  color: #77717d;
  font-size: 14px;
  line-height: 1.35;
}

.continue-button {
  width: 100%;
  min-height: 56px;
  margin-top: 20px;
  border: 0;
  border-radius: 17px;
  background: #6842c2;
  color: #ffffff;
  font-size: 17px;
  font-weight: 800;
  cursor: pointer;
}

.continue-button:disabled {
  background: #d6cfdf;
  color: #8c8593;
  cursor: not-allowed;
}

.sheet-disclaimer {
  margin: 15px 4px 0;
  color: #8a8490;
  font-size: 12px;
  line-height: 1.45;
  text-align: center;
}

body.sheet-open {
  overflow: hidden;
}
    @media (min-width: 660px) {
      .page-content {
        padding-right: 28px;
        padding-left: 28px;
      }

      .details-grid {
        display: grid;
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
        gap: 16px;
      }

      .details-grid .section {
        margin-top: 16px;
      }
    }

<body class="aq-detail">
  <main class="app">
    <header class="topbar">
      <a
        class="topbar-button"
        href="procedures.html"
        aria-label="Return to procedure library"
      >
        ‹
      </a>

      <div class="brand">
        Aesthet<span>IQ</span>

      <button
        id="topFavoriteButton"

 <div

<!-- Treatment option bottom sheet -->
<div
  class="option-sheet-backdrop"
  id="optionSheetBackdrop"
>
  <section
    class="option-sheet"
    role="dialog"
    aria-modal="true"
    aria-labelledby="optionSheetTitle"
  >
    <div class="sheet-handle"></div>

    <button
      class="sheet-close"
      id="closeOptionSheet"
      type="button"
      aria-label="Close"
    >
      ×
    </button>

    <p class="sheet-label">
      Selected procedure
    </p>

    <h2 id="optionSheetTitle">
      Treatment options
    </h2>

    <p
      class="sheet-description"
      id="optionSheetDescription"
    >
      Choose the treatment option you would like to preview.
    </p>

    <div
      class="option-list"
      id="treatmentOptionList"
    ></div>

    <button
      class="continue-button"
      id="continueToCamera"
      type="button"
      disabled
    >
      Continue to camera
    </button>

    <p class="sheet-disclaimer">
      Simulations are educational previews and do not predict exact clinical
      results. Available products vary by provider.
    </p>
  </section>
</div>

function getProcedureOptionData(procedureId) {
  const fillerProcedures = [
    "cheek-filler",
    "chin-filler",
    "jawline-filler",
    "temple-filler"
  ];

  if (
    fillerProcedures.includes(
      procedureId
    )
  ) {
    const procedure =
      getProcedureById(procedureId);

    return {
      title:
        procedure?.name ||
        "Filler",
      description:
        "Choose a filler product to preview, or let the provider decide.",
      options:
        getFillerProductsForProcedure(
          procedureId
        ).map(product => ({
          id: product.id,
          name: product.name,
          detail:
            product.id === "provider"
              ? "Preview without selecting a specific filler product."
              : "Product-specific educational preview profile."
        }))
    };
  }

  // Use the detailed options whenever they exist.
  if (procedureOptions[procedureId]) {
    return procedureOptions[procedureId];
  }

  const procedure = getProcedureById(procedureId);

  if (!procedure) {
    return null;
  }

  const defaultOptions = {
    Surgical: [
      {
        id: "standard-surgical-approach",
        name: "Standard Surgical Approach",
        detail:
          "The exact technique and materials are selected by the surgeon based on your anatomy, goals and medical evaluation."

    "Non-Surgical": [

        id: "standard-treatment",

      {
        id: "custom-dental-treatment",
        name: "Customized Dental Treatment",
        detail:
          "Materials, shade and treatment technique are selected after a dental examination and smile assessment."
      }
    ]
  };

  return {
    title: procedure.name,
    description:
      "Review the common treatment approach used for this procedure.",
    options:
      defaultOptions[procedure.type] || [
        {
          id: "provider-selected",
          name: "Provider-Selected Treatment",
          detail:
            "Treatment details are customized following an in-person professional evaluation."
        }
      ]
  };

  function escapeHtml(value) {
    return String(value || "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function getDisplayStatus(item) {
    const simulation =
      String(item.simulation || "").toLowerCase();

    if (
      simulation.includes("2d available") ||
      simulation.includes("interactive")
    ) {
      return "Interactive";
    }

    if (simulation.includes("experimental 2d")) {
      return "Experimental 2D";
    }

    if (
      simulation.includes("camera preview") ||
      item.cameraProcedure
    ) {
      return "Camera Preview";
    }

    return "Educational";
  }

  function getStatusClass(status) {
    if (status === "Interactive") {
      return "status-interactive";
    }

    if (status === "Experimental 2D") {
      return "status-preview";
    }

    if (status === "Camera Preview") {
      return "status-preview";
    }

    return "status-educational";
  }

  function createList(items, extraClass = "") {
    if (!Array.isArray(items) || items.length === 0) {
      return `
        <p>
          Additional information will be added as this
          procedure is reviewed.
        </p>
      `;
    }

    return `
      <ul class="information-list ${extraClass}">
        ${items
          .map(
            item =>
              `<li>${escapeHtml(item)}</li>`
          )
          .join("")}
      </ul>
    `;
  }

  function getCameraInformation(item, status) {
    if (status === "Experimental 2D") {
      return {
        title: "Experimental body preview",
        description:
          "Use a photo for an illustrative MediaPipe body-contour preview. This is not a surgical outcome prediction.",
        buttonText: "Open Body Preview",
        disabled: false
      };
    }

    if (status === "Interactive") {
      return {
        title: "Interactive preview available",
        description:
          "Open the AesthetIQ camera to explore a visual preview. Results are educational estimates and are not medical predictions.",
        buttonText: "Open Interactive Camera",
        disabled: false
      };
    }

    if (status === "Camera Preview") {
      return {
        title: "Camera preview available",
        description:
          "You can open the camera experience while this procedure's interactive controls are still being developed.",
        buttonText: "Open Camera Preview",
        disabled: false
      };
    }

    return {
      title: "Educational information only",
      description:
        "An interactive camera preview has not been added for this procedure yet.",
      buttonText: "Camera Coming Soon",
      disabled: true
    };
  }

  function buildCameraUrl(item, status) {
    if (status === "Experimental 2D") {
      return (
        "body-simulation.html?procedure=" +
        encodeURIComponent(item.id)
      );
    }

    if (
      status === "Interactive" &&
      item.cameraProcedure
    ) {
      return (
        "simulation.html?procedure=" +
        encodeURIComponent(item.cameraProcedure)
      );
    }

    if (status === "Camera Preview") {
      return (
        "simulation.html?mode=preview" +
        "&procedure=" +
        encodeURIComponent(
          item.cameraProcedure || item.id
        )
      );
    }

    return "#";
  }

      "Procedure Not Found | AesthetIQ";

    pageContent.innerHTML = `
      <section class="error-state">
        <h1>Procedure not found</h1>

        <p>
          The procedure link may be incomplete, or the selected
          procedure may not exist in the database.
        </p>

        <a
          class="error-link"
          href="procedures.html"
        >
          Return to Procedure Library
        </a>
      </section>
    `;

    bottomActionBar.hidden = true;
    topFavoriteButton.disabled = true;
  }

  function openTreatmentOptions() {
  if (getDisplayStatus(procedure) === "Experimental 2D") {
    window.location.href = selectedCameraUrl;
    return;
  }

  if (
    usesFillerGoalWizard(
      procedureId
    )
  ) {
    wizardStep = 1;
    selectedProduct = "";
    selectedGoal = "";
    selectedIntensity = "";

    renderFillerGoalWizardStep();

    backdrop.classList.add("open");
    document.body.classList.add(
      "sheet-open"
    );

    return;
  }

  if (
    usesNeuromodulatorWizard(
      procedureId
    )
  ) {
    wizardStep = 1;
    selectedProduct = "";
    selectedIntensity = "";

    renderNeuromodulatorWizardStep();

    backdrop.classList.add("open");
    document.body.classList.add(
      "sheet-open"
    );

    return;
  }

  if (procedureId !== "lip-filler") {
    const treatmentData =
      getProcedureOptionData(procedureId);

    if (!treatmentData) {
      window.location.href =
        selectedCameraUrl;
      return;
    }

    selectedOption = "";

    titleElement.textContent =
      treatmentData.title;

    descriptionElement.textContent =
      treatmentData.description;

    continueButton.textContent =
      "Continue to camera";

    continueButton.disabled = true;
    optionList.innerHTML = "";

    treatmentData.options.forEach(option => {
      const label =
        document.createElement("label");

      label.className =
        "treatment-option";

      label.innerHTML = `
        <input
          type="radio"
          name="treatmentOption"
          value="${escapeHtml(option.id)}"
        />

        <span class="option-copy">
          <span class="option-name">
            ${escapeHtml(option.name)}
          </span>

          <span class="option-detail">
            ${escapeHtml(option.detail)}
          </span>
        </span>
      `;

      const radio =
        label.querySelector("input");

      radio.addEventListener(
        "change",
        () => {
          selectedOption =
            option.id;

          continueButton.disabled =
            false;

          optionList
            .querySelectorAll(
              ".treatment-option"
            )
            .forEach(item => {
              item.classList.remove(
                "selected"
              );
            });

          label.classList.add(
            "selected"
          );
        }
      );

      optionList.appendChild(label);
    });

    backdrop.classList.add("open");
    document.body.classList.add(
      "sheet-open"
    );

    return;
  }

  wizardStep = 1;
  selectedStyle = "";
  selectedProduct = "";
  selectedIntensity = "";

  renderLipWizardStep();

  backdrop.classList.add("open");
  document.body.classList.add(
    "sheet-open"
  );
}

  function renderNeuromodulatorWizardStep() {
  optionList.innerHTML = "";
  continueButton.disabled = true;

  if (wizardStep === 1) {
    const treatmentData =
      getProcedureOptionData(
        procedureId
      );

    titleElement.textContent =
      treatmentData?.title ||
      "Neuromodulator";

    descriptionElement.textContent =
      "Step 1 of 2 — Choose the product you want represented in the educational preview.";

    continueButton.textContent =
      "Choose intensity";

    (
      treatmentData?.options || []
    ).forEach(option => {
      createWizardOption(
        option,
        "neuromodulatorProduct",
        selectedProduct,
        value => {
          selectedProduct = value;
        }
      );
    });

    return;
  }

  titleElement.textContent =
    "Choose Simulation Intensity";

  descriptionElement.textContent =
    "Step 2 of 2 — Choose how much visible line softening the educational preview should show.";

  continueButton.textContent =
    "Continue to camera";

  [
    {
      id: "natural",
      name: "Natural",
      detail:
        "Subtle line softening while retaining more visible texture."
    },
    {
      id: "balanced",
      name: "Balanced",
      detail:
        "Moderate line softening with natural-looking skin texture."
    },
    {
      id: "enhanced",
      name: "Enhanced",
      detail:
        "A stronger visual preview of line softening."
    }
  ].forEach(option => {
    createWizardOption(
      option,
      "neuromodulatorIntensity",
      selectedIntensity,
      value => {
        selectedIntensity = value;
      }
    );
  });
}

  function renderFillerGoalWizardStep() {
  optionList.innerHTML = "";
  continueButton.disabled = true;

  if (wizardStep === 1) {
    titleElement.textContent =
      "Choose Filler Product";

    descriptionElement.textContent =
      "Step 1 of 3 — Select a filler product, or let the provider decide.";

    continueButton.textContent =
      "Choose visual goal";

    getFillerProductsForProcedure(
      procedureId
    ).forEach(product => {
      createWizardOption(
        {
          id: product.id,
          name: product.name,
          detail:
            product.id === "provider"
              ? "Preview without selecting a specific filler product."
              : "Use this product's educational preview profile."
        },
        "fillerProduct",
        selectedProduct,
        value => {
          selectedProduct = value;
        }
      );
    });

    return;
  }

  if (wizardStep === 2) {
    titleElement.textContent =
      "Choose Your Visual Goal";

    descriptionElement.textContent =
      "Step 2 of 3 — Choose the appearance you want the simulation to emphasize.";

    continueButton.textContent =
      "Choose intensity";

    getFillerGoalsForProcedure(
      procedureId
    ).forEach(goal => {
      createWizardOption(
        goal,
        "fillerGoal",
        selectedGoal,
        value => {
          selectedGoal = value;
        }
      );
    });

    return;
  }

  titleElement.textContent =
    "Choose Simulation Intensity";

  descriptionElement.textContent =
    "Step 3 of 3 — Choose how subtle or noticeable the educational preview should appear.";

  continueButton.textContent =
    "Continue to camera";

  [
    {
      id: "natural",
      name: "Natural",
      detail:
        "A subtle preview with conservative visible change."
    },
    {
      id: "balanced",
      name: "Balanced",
      detail:
        "A moderate preview intended to preserve overall facial balance."
    },
    {
      id: "enhanced",
      name: "Enhanced",
      detail:
        "A more noticeable preview of the selected visual goal."
    }
  ].forEach(option => {
    createWizardOption(
      option,
      "fillerIntensity",

        selectedIntensity = value;
      }

  });
}

  function renderLipWizardStep() {
  optionList.innerHTML = "";
  continueButton.disabled = true;

  if (wizardStep === 1) {
    titleElement.textContent =
      "Choose Your Desired Look";

    descriptionElement.textContent =
      "Step 1 of 3 — Select the lip shape and aesthetic you want to preview.";

    continueButton.textContent =
      "Choose filler product";

    const styles =
      procedureOptions["lip-filler"].options;

    styles.forEach(option => {
      createWizardOption(
        option,
        "lipStyle",
        selectedStyle,
        value => {
          selectedStyle = value;
        }
      );
    });

    return;
  }

  if (wizardStep === 2) {
    titleElement.textContent =
      "Choose Filler Product";

    descriptionElement.textContent =
      "Step 2 of 3 — Select a filler product, or let the provider decide.";

    continueButton.textContent =
      "Choose intensity";

    lipProducts.forEach(option => {
      createWizardOption(
        option,
        "lipProduct",
        selectedProduct,
        value => {
          selectedProduct = value;
        }
      );
    });

    return;
  }

  titleElement.textContent =
    "Choose Simulation Intensity";

  descriptionElement.textContent =
    "Step 3 of 3 — Select how subtle or noticeable you want the educational preview to appear.";

  continueButton.textContent =
    "Continue to camera";

  const intensities = [
    {
      id: "natural",
      name: "Natural",
      detail:
        "A subtle enhancement with conservative volume."
    },
    {
      id: "balanced",
      name: "Balanced",
      detail:
        "Moderate fullness while maintaining natural proportions."
    },
    {
      id: "enhanced",
      name: "Enhanced",
      detail:
        "A more noticeable preview with stronger volume and projection."
    }
  ];

  intensities.forEach(option => {
    createWizardOption(
      option,
      "lipIntensity",
      selectedIntensity,
      value => {
        selectedIntensity = value;
      }
    );
  });
}

 function createWizardOption(
  option,
  radioName,
  currentValue,
  onSelect
) {
  const label =
    document.createElement("label");

  label.className =
    "treatment-option";

  if (currentValue === option.id) {
    label.classList.add("selected");
  }

  label.innerHTML = `
    <input
      type="radio"
      name="${escapeHtml(radioName)}"
      value="${escapeHtml(option.id)}"
      ${
        currentValue === option.id
          ? "checked"
          : ""
      }
    />

    <span class="option-copy">
      <span class="option-name">
        ${escapeHtml(option.name)}
      </span>

      <span class="option-detail">
        ${escapeHtml(option.detail)}
      </span>
    </span>
  `;

  const radio =
    label.querySelector("input");

  radio.addEventListener(
    "change",
    () => {
      onSelect(option.id);

      continueButton.disabled =
        false;

      optionList
        .querySelectorAll(
          ".treatment-option"
        )
        .forEach(item => {
          item.classList.remove(
            "selected"
          );
        });

      label.classList.add(
        "selected"
      );
    }
  );

  optionList.appendChild(label);

  if (currentValue === option.id) {
    continueButton.disabled =
      false;
  }
} 
  
  function closeTreatmentOptions() {
    backdrop.classList.remove("open");

    document.body.classList.remove(
      "sheet-open"
    );
  }

  function handleCameraRequest() {
    if (
      !procedure ||
      !selectedCameraUrl ||
      selectedCameraUrl === "#"
    ) {
      return;
    }

    openTreatmentOptions();
  }

  function getSavedProcedures() {
    try {
      const saved =
        JSON.parse(
          localStorage.getItem(
            STORAGE_KEY
          ) || "[]"
        );

      return Array.isArray(saved)
        ? saved.filter(
            item =>
              typeof item === "string"
          )
        : [];
    } catch (error) {
      console.error(
        "Could not read saved procedures:",
        error
      );

      return [];
    }
  }

  function saveProcedures(savedProcedures) {
    try {
      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(savedProcedures)
      );

      return true;
    } catch (error) {
      console.error(
        "Could not save procedure:",
        error
      );

      return false;
    }
  }

  function isSaved() {
    return Boolean(
      procedureId &&
      getSavedProcedures().includes(
        procedureId
      )
    );
  }

  function updateFavoriteButtons() {
    const saved = isSaved();
    const icon = saved ? "♥" : "♡";

    topFavoriteButton.textContent = icon;
    bottomFavoriteButton.textContent = icon;

    topFavoriteButton.classList.toggle(
      "saved",
      saved
    );

    bottomFavoriteButton.classList.toggle(
      "saved",
      saved
    );

    const label = saved
      ? "Remove saved procedure"
      : "Save procedure";

    topFavoriteButton.setAttribute(
      "aria-label",
      label
    );

    bottomFavoriteButton.setAttribute(
      "aria-label",
      label
    );

    const saveProcedureButton =
      document.getElementById(
        "saveProcedureButton"
      );

    const saveProcedureIcon =
      document.getElementById(
        "saveProcedureIcon"
      );

    const saveProcedureText =
      document.getElementById(
        "saveProcedureText"
      );

    if (saveProcedureButton) {
      saveProcedureButton.classList.toggle(
        "saved",
        saved
      );

      saveProcedureButton.setAttribute(
        "aria-label",
        label
      );
    }

    if (saveProcedureIcon) {
      saveProcedureIcon.textContent =
        icon;
    }

    if (saveProcedureText) {
      saveProcedureText.textContent =
        saved
          ? "Saved Procedure"
          : "Save Procedure";
    }
  }

  function showSaveConfirmation(message) {
    const confirmation =
      document.getElementById(
        "saveConfirmation"
      );

    if (!confirmation) {
      return;
    }

    confirmation.textContent =
      message;

    if (confirmationTimer) {
      clearTimeout(
        confirmationTimer
      );
    }

    confirmationTimer =
      setTimeout(() => {
        confirmation.textContent = "";
      }, 2500);
  }

  function toggleFavorite() {
    if (!procedure || !procedureId) {
      return;
    }

    let savedProcedures =
      getSavedProcedures();

    const currentlySaved =
      savedProcedures.includes(
        procedureId
      );

    if (currentlySaved) {
      savedProcedures =
        savedProcedures.filter(
          savedId =>
            savedId !== procedureId
        );
    } else {
      savedProcedures.push(
        procedureId
      );
    }

    if (!saveProcedures(savedProcedures)) {
      showSaveConfirmation(
        "Could not update saved procedures."
      );

      return;
    }

    updateFavoriteButtons();

    showSaveConfirmation(
      currentlySaved
        ? "Removed from Saved Procedures"
        : "Added to Saved Procedures"
    );
  }

  topFavoriteButton.addEventListener(
    "click",
    toggleFavorite
  );

  bottomFavoriteButton.addEventListener(
    "click",
    toggleFavorite
  );

  bottomCameraButton.addEventListener(
    "click",
    handleCameraRequest
  );

  closeButton.addEventListener(
    "click",
    closeTreatmentOptions
  );

  backdrop.addEventListener(
    "click",
    event => {
      if (event.target === backdrop) {
        closeTreatmentOptions();
      }
    }
  );

 document.addEventListener(
  "keydown",
  event => {
    if (
      event.key === "Escape" &&
      backdrop.classList.contains("open")
    ) {
      closeTreatmentOptions();
    }
  }
);

continueButton.addEventListener(
  "click",
  () => {

    // ------------------------------------------
    // LIP FILLER 3-STEP WIZARD
    // ------------------------------------------

    if (procedureId === "lip-filler") {

      // STEP 1 → STYLE
      if (wizardStep === 1) {
        if (!selectedStyle) {
          return;
        }

        wizardStep = 2;
        renderLipWizardStep();
        return;
      }

      // STEP 2 → PRODUCT
      if (wizardStep === 2) {
        if (!selectedProduct) {
          return;
        }

        wizardStep = 3;
        renderLipWizardStep();
        return;
      }

      // STEP 3 → CAMERA
      if (wizardStep === 3) {
        if (
          !selectedIntensity ||
          !selectedCameraUrl
        ) {
          return;
        }

        const cameraUrl =
          new URL(
            selectedCameraUrl,
            window.location.href
          );

        cameraUrl.searchParams.set(
          "style",
          selectedStyle
        );

        cameraUrl.searchParams.set(
          "product",
          selectedProduct
        );

        cameraUrl.searchParams.set(
          "intensity",
          selectedIntensity
        );

        window.location.href =
          cameraUrl.href;

        return;
      }
    }

    // ------------------------------------------
    // NEUROMODULATOR 2-STEP WIZARD
    // ------------------------------------------

    if (
      usesNeuromodulatorWizard(
        procedureId
      )
    ) {
      if (wizardStep === 1) {
        if (!selectedProduct) {
          return;
        }

        wizardStep = 2;
        renderNeuromodulatorWizardStep();
        return;
      }

      if (wizardStep === 2) {
        if (
          !selectedIntensity ||
          !selectedCameraUrl
        ) {
          return;
        }

        const cameraUrl =
          new URL(
            selectedCameraUrl,
            window.location.href
          );

        cameraUrl.searchParams.set(
          "option",
          selectedProduct
        );

        cameraUrl.searchParams.set(
          "neuromodulator",
          selectedProduct
        );

        cameraUrl.searchParams.set(
          "intensity",
          selectedIntensity
        );

        window.location.href =
          cameraUrl.href;

        return;
      }
    }

    // ------------------------------------------
    // NON-LIP FILLER 3-STEP WIZARD
    // ------------------------------------------

    if (
      usesFillerGoalWizard(
        procedureId
      )
    ) {
      if (wizardStep === 1) {
        if (!selectedProduct) {
          return;
        }

        wizardStep = 2;
        renderFillerGoalWizardStep();
        return;
      }

      if (wizardStep === 2) {
        if (!selectedGoal) {
          return;
        }

        wizardStep = 3;
        renderFillerGoalWizardStep();
        return;
      }

      if (wizardStep === 3) {
        if (
          !selectedIntensity ||
          !selectedCameraUrl
        ) {
          return;
        }

        const cameraUrl =
          new URL(
            selectedCameraUrl,
            window.location.href
          );

        cameraUrl.searchParams.set(
          "option",
          selectedProduct
        );

        cameraUrl.searchParams.set(
          "product",
          selectedProduct
        );

        cameraUrl.searchParams.set(
          "goal",
          selectedGoal
        );

        cameraUrl.searchParams.set(
          "intensity",
          selectedIntensity
        );

        window.location.href =
          cameraUrl.href;

        return;
      }
    }

    // ------------------------------------------
    // ALL OTHER PROCEDURES
    // ------------------------------------------

    if (
      !selectedOption ||
      !selectedCameraUrl
    ) {
      return;
    }

    const cameraUrl =
      new URL(
        selectedCameraUrl,
        window.location.href
      );

    cameraUrl.searchParams.set(
      "option",
      selectedOption
    );

    window.location.href =
      cameraUrl.href;
  }
); 

  window.addEventListener(
    "storage",
    event => {
      if (event.key === STORAGE_KEY) {
        updateFavoriteButtons();
      }
    }
  );

  if (!procedureId || !procedure) {
    renderError();
  } else {
    renderProcedure(procedure);
    updateFavoriteButtons();
  }
</script>
